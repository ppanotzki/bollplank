name: Bug
description: Something in Bollplank did not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Leave out keys, tokens, sign in details and private project names. For a security problem, use private vulnerability reporting under the Security tab instead.
  - type: input
    id: version
    attributes:
      label: Bollplank version
      description: What `bollplank version` prints.
      placeholder: Bollplank 0.1.0, build 12
    validations:
      required: true
  - type: input
    id: clients
    attributes:
      label: Client versions
      description: What `claude --version` and `codex --version` print, for the clients you use.
      placeholder: Claude Code 2.1.312, Codex 0.166.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system and `node --version`.
      placeholder: macOS 26, Node 22.11.0
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The command or request, and the result. Paste the JSON result when there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: bollplank doctor
      description: The output of `bollplank doctor --offline`, if it helps.
      render: text
